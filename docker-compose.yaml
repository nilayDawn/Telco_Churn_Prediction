version: '3.8'

services:
  churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_prediction_api
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped

  churn-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_prediction_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://churn-api:8000
    command: streamlit run app/frontend.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - churn-api
    restart: unless-stopped

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: mlflow_ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow ui --host 0.0.0.0 --port 5000
    restart: unless-stopped