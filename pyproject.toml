[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction"
version = "0.1.0"
description = "Customer Churn Prediction Modular ML System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "joblib>=1.3.0",
    "lightgbm>=4.0.0",
    "loguru>=0.7.0",
    "matplotlib>=3.7.0",
    "mlflow>=2.10.0",
    "numpy>=1.24.0,<2.0.0",
    "optuna>=3.0.0",
    "pandas>=2.0.0",
    "path>=16.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.2.0",
    "seaborn>=0.12.0",
    "streamlit>=1.60.0",
    "uvicorn>=0.22.0",
    "xgboost>=2.0.0",
]

[dependency-groups]
dev = [
    "great-expectations>=0.17.0",
    "httpx>=0.24.0",
    "ipykernel>=6.0.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "statsmodels>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]
