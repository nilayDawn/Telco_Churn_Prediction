data:
  raw_path: "data/raw/Telco-Customer-Churn.csv"
  processed_train_path: "data/processed/train.csv"
  processed_test_path: "data/processed/test.csv"
  target_column: "Churn"
  test_size: 0.2
  random_state: 42

artifacts:
  model_dir: "artifacts"
  model_name: "model.pkl"
  preprocessor_name: "preprocessor.pkl"

mlflow:
  experiment_name: "Customer_Churn_Prediction"
  tracking_uri: "sqlite:///mlflow.db"

model:
  type: "lightgbm"
  params:
    n_estimators: 100
    learning_rate: 0.010001063763219657
    max_depth: 4
    num_leaves: 21
    min_child_samples: 15
    subsample: 0.8416931487331285
    colsample_bytree: 0.6589724887114597
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
    objective: "binary"
    metric: "binary_logloss"